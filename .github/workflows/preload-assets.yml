name: Preload Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  preload-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add preload, preconnect and dns-prefetch
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          function walk(dir){
            let results=[];
            for(const file of fs.readdirSync(dir)){
              const full=path.join(dir,file);

              if(full.includes(".git")) continue;
              if(full.includes(".github")) continue;
              if(full.includes("node_modules")) continue;

              const stat=fs.statSync(full);

              if(stat.isDirectory())
                results=results.concat(walk(full));
              else if(file.endsWith(".html"))
                results.push(full);
            }
            return results;
          }

          const files=walk(".");

          files.forEach(file=>{

            let html=fs.readFileSync(file,"utf8");

            if(html.includes('id="auto-preload-assets"'))
              return;

            const insert=`
<!-- Auto Generated Preload Assets -->
<link id="auto-preload-assets" rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<link rel="dns-prefetch" href="//www.google-analytics.com">
<link rel="dns-prefetch" href="//www.googletagmanager.com">
<link rel="dns-prefetch" href="//pagead2.googlesyndication.com">
<link rel="dns-prefetch" href="//googleads.g.doubleclick.net">

<link rel="preload" href="style.css" as="style">
<link rel="preload" href="script.js" as="script">
`;

            html=html.replace("</head>",insert+"\n</head>");

            fs.writeFileSync(file,html);

            console.log("Updated:",file);

          });
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto optimize preload assets"

          git push
