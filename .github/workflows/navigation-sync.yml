name: Navigation Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Navigation Sync Script
        run: |
          mkdir -p scripts

          cat > scripts/navigation-sync.js << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const ROOT = process.cwd();

          // Primary header nav only — footer legal links (Privacy Policy,
          // Terms, Disclaimer) stay in the footer and are never touched here.
          const NAV_ITEMS = [
            { href: "", label: "Home" },
            { href: "all-tools/", label: "All Tools" },
            { href: "Blog/", label: "Blog" },
            { href: "about/", label: "About" },
            { href: "contact/", label: "Contact" },
          ];

          function getFiles(dir, files = []) {
            for (const item of fs.readdirSync(dir)) {
              if (item === "node_modules") continue;
              if (item === ".git") continue;
              if (item === ".github") continue;

              const full = path.join(dir, item);

              if (fs.statSync(full).isDirectory()) {
                getFiles(full, files);
              } else if (item === "index.html") {
                files.push(full);
              }
            }
            return files;
          }

          // How many "../" a file needs to reach the repo root, based on its
          // own depth — instead of a single hardcoded "../" for every page.
          function relPrefix(file) {
            const rel = path.relative(ROOT, path.dirname(file));
            if (rel === "") return "./";
            const depth = rel.split(path.sep).length;
            return "../".repeat(depth);
          }

          function buildNav(prefix) {
            const links = NAV_ITEMS.map(
              (item) => `      <li><a href="${prefix}${item.href}">${item.label}</a></li>`
            ).join("\n");

            return [
              '<nav class="main-nav" id="main-nav" aria-label="Primary">',
              '        <ul>',
              links,
              '        </ul>',
              '      </nav>'
            ].join("\n");
          }

          const pages = getFiles(ROOT);
          let changed = 0;

          pages.forEach((file) => {
            let html = fs.readFileSync(file, "utf8");
            const nav = buildNav(relPrefix(file));

            // Isolate the <header class="site-header">...</header> block so
            // this can never match the breadcrumb <nav> or the footer's
            // matching brand link/logo — both of which also exist on every page.
            const headerMatch = html.match(/<header[^>]*class="site-header"[\s\S]*?<\/header>/i);

            if (!headerMatch) {
              console.warn("No site-header found, skipping:", file);
              return;
            }

            const originalHeader = headerMatch[0];

            // Replace whatever sits between the brand link and the
            // header-actions div (missing nav, correct nav, or broken nav —
            // all three cases are handled the same way).
            const updatedHeader = originalHeader.replace(
              /(<\/a>\s*)(?:<nav[\s\S]*?<\/nav>\s*)?(<div class="header-actions">)/i,
              `$1${nav}\n\n      $2`
            );

            if (updatedHeader === originalHeader) {
              console.warn("Header pattern not matched, skipping:", file);
              return;
            }

            html = html.replace(originalHeader, updatedHeader);
            fs.writeFileSync(file, html);
            changed++;
            console.log("Updated:", file);
          });

          console.log(`Navigation synchronized on ${changed}/${pages.length} pages.`);
          EOF

      - name: Run Navigation Sync
        run: node scripts/navigation-sync.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto sync navigation"

          git push
