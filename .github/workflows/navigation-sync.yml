name: Navigation Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Navigation Sync Script
        run: |
          mkdir -p scripts

          cat > scripts/navigation-sync.js << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const ROOT = process.cwd();

          const NAV = `
          <nav class="main-navigation">
            <a href="../">Home</a>
            <a href="../all-tools/">All Tools</a>
            <a href="../Blog/">Blog</a>
            <a href="../about/">About</a>
            <a href="../contact/">Contact</a>
            <a href="../privacy-policy/">Privacy Policy</a>
            <a href="../terms/">Terms</a>
            <a href="../disclaimer/">Disclaimer</a>
          </nav>
          `;

          function getFiles(dir){
            let files=[];

            for(const item of fs.readdirSync(dir)){
              if(item==="node_modules") continue;
              if(item===".git") continue;
              if(item===".github") continue;

              const full=path.join(dir,item);

              if(fs.statSync(full).isDirectory()){
                files=files.concat(getFiles(full));
              }else if(item==="index.html"){
                files.push(full);
              }
            }

            return files;
          }

          const pages=getFiles(ROOT);

          pages.forEach(file=>{

            let html=fs.readFileSync(file,"utf8");

            html=html.replace(
              /<nav[\s\S]*?<\/nav>/i,
              NAV
            );

            fs.writeFileSync(file,html);

            console.log("Updated:",file);

          });

          console.log("Navigation synchronized successfully.");
          EOF

      - name: Run Navigation Sync
        run: node scripts/navigation-sync.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto sync navigation"

          git push
