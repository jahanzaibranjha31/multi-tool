name: Generate Canonical Tags

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  generate-canonicals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run canonical tag generator
        run: python3 generate_canonicals.py

      - name: Commit and push fixes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-fix canonical tags [skip ci]"
          file_pattern: "**/*.html"
