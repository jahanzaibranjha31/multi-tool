name: Validate Sitemap

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate sitemap.xml structure
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "❌ sitemap.xml not found."
            exit 1
          fi

          xmllint --noout sitemap.xml

          echo "✅ sitemap.xml is valid XML."

      - name: Extract URLs
        run: |
          grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml > urls.txt

          if [ ! -s urls.txt ]; then
            echo "❌ No URLs found in sitemap."
            exit 1
          fi

          echo "Found URLs:"
          cat urls.txt

      - name: Validate all URLs
        run: |
          FAILED=0

          while read url; do
            echo ""
            echo "Checking $url"

            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$url")

            if [ "$STATUS" = "200" ]; then
              echo "✅ OK ($STATUS)"
            else
              echo "❌ Failed ($STATUS)"
              FAILED=1
            fi
          done < urls.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more sitemap URLs failed."
            exit 1
          fi

      - name: Success
        run: |
          echo "🎉 Sitemap validation completed successfully."
