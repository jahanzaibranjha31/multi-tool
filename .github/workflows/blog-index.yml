name: Update Blog Index

on:
  push:
    paths:
      - "Blog/**"
      - "blog/**"

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate blog index
        run: |
          mkdir -p Blog

          cat > Blog/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Blog | Multi Tools</title>
              <meta name="description" content="Read the latest guides, tutorials, AI articles, calculator tips and online tool resources from Multi Tools.">
              <style>
                  body{
                      font-family:Arial,sans-serif;
                      max-width:1000px;
                      margin:auto;
                      padding:40px;
                      background:#f5f7fb;
                  }
                  h1{
                      text-align:center;
                  }
                  .card{
                      background:#fff;
                      padding:20px;
                      margin:20px 0;
                      border-radius:12px;
                      box-shadow:0 5px 15px rgba(0,0,0,.08);
                  }
                  a{
                      color:#2563eb;
                      text-decoration:none;
                      font-size:20px;
                      font-weight:bold;
                  }
                  p{
                      color:#555;
                  }
              </style>
          </head>
          <body>

          <h1>Multi Tools Blog</h1>

          BLOG_LIST

          </body>
          </html>
          EOF

          blogs=""

          for d in Blog/*/ ; do
            if [ -d "$d" ]; then
              name=$(basename "$d")
              title=$(echo "$name" | sed 's/-/ /g')
              blogs="$blogs
              <div class=\"card\">
              <a href=\"./$name/\">$title</a>
              <p>Read the complete guide about $title.</p>
              </div>"
            fi
          done

          sed -i "s|BLOG_LIST|$blogs|g" Blog/index.html

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Blog/index.html
          git commit -m "Auto update Blog index" || echo "No changes"
          git push
