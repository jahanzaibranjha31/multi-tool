name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        shell: bash
        run: |
          BASE_URL="https://multitool.click"
          TODAY=$(date +%F)

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          find . -type f -name "index.html" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            ! -path "./.well-known/*" \
            | sort | while read FILE
          do

            DIR=$(dirname "$FILE")
            DIR=${DIR#./}

            if [ "$DIR" = "." ]; then
              URL="$BASE_URL/"
              PRIORITY="1.0"
              CHANGEFREQ="daily"

            elif [[ "$DIR" == Blog* ]]; then
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.8"
              CHANGEFREQ="weekly"

            elif [[ "$DIR" == *privacy* || "$DIR" == *terms* || "$DIR" == *disclaimer* || "$DIR" == *about* || "$DIR" == *contact* ]]; then
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.5"
              CHANGEFREQ="monthly"

            else
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.9"
              CHANGEFREQ="weekly"
            fi

            cat >> sitemap.xml <<EOF
          <url>
            <loc>$URL</loc>
            <lastmod>$TODAY</lastmod>
            <changefreq>$CHANGEFREQ</changefreq>
            <priority>$PRIORITY</priority>
          </url>
EOF

          done

          echo "</urlset>" >> sitemap.xml

          awk '!seen[$0]++' sitemap.xml > sitemap-temp.xml
          mv sitemap-temp.xml sitemap.xml

      - name: Commit sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "🤖 Auto update sitemap"
            git push
          fi
