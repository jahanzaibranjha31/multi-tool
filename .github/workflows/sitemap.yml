name: 🤖 Auto Sitemap Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        shell: bash
        run: |
          BASE_URL="https://multitool.click"
          TODAY=$(date -u +"%Y-%m-%d")

          cat > sitemap.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
EOF

          find . \
            -type f \
            -name "index.html" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            ! -path "./dist/*" \
            ! -path "./build/*" \
            | sort | while read FILE
          do

            DIR=$(dirname "$FILE")
            DIR="${DIR#./}"

            if [[ "$DIR" == "." ]]; then
              URL="$BASE_URL/"
              PRIORITY="1.0"
              CHANGEFREQ="daily"

            elif [[ "$DIR" == Blog* ]]; then
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.8"
              CHANGEFREQ="weekly"

            elif [[ "$DIR" =~ (privacy|terms|disclaimer|about|contact) ]]; then
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.5"
              CHANGEFREQ="monthly"

            else
              URL="$BASE_URL/$DIR/"
              PRIORITY="0.9"
              CHANGEFREQ="weekly"
            fi

            cat >> sitemap.xml <<EOF
  <url>
    <loc>$URL</loc>
    <lastmod>$TODAY</lastmod>
    <changefreq>$CHANGEFREQ</changefreq>
    <priority>$PRIORITY</priority>
  </url>
EOF

          done

          echo "</urlset>" >> sitemap.xml

          awk '!seen[$0]++' sitemap.xml > sitemap-clean.xml
          mv sitemap-clean.xml sitemap.xml

      - name: Validate sitemap
        run: |
          grep "<url>" sitemap.xml
          grep "</urlset>" sitemap.xml

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "🤖 Auto-update sitemap.xml"
            git push
          fi
