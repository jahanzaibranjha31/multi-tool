name: Generate Homepage

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'index.html'   # prevent infinite loop when the bot commits
  workflow_dispatch:   # allow manual trigger from Actions tab
  schedule:
    - cron: '0 3 * * *'  # run daily at 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so we can commit back ─────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Run the generator script ────────────────────────────────────────
      - name: Generate homepage
        run: python .github/scripts/generate_homepage.py

      # ── 4. Commit & push if index.html changed ─────────────────────────────
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-regenerate homepage [skip ci]"
            git push
          fi

