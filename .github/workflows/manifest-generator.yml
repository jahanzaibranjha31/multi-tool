name: Generate Web Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate site.webmanifest
        run: |
          cat > site.webmanifest << 'EOF'
          {
            "name": "Multi Tools",
            "short_name": "MultiTools",
            "description": "Free Online Tools for Everyone",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#ffffff",
            "theme_color": "#4f46e5",
            "lang": "en",
            "categories": [
              "utilities",
              "productivity",
              "developer",
              "education"
            ],
            "icons": [
              {
                "src": "assets/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "assets/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site.webmanifest

          git diff --cached --quiet || git commit -m "Auto generate site.webmanifest"

          git push
