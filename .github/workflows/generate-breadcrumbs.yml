name: Generate Breadcrumb JSON-LD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  breadcrumbs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Breadcrumb Schema
        run: |
          find . -name "index.html" | while read file; do

            if grep -q 'application/ld+json' "$file"; then
              echo "Skipping $file (schema already exists)"
              continue
            fi

            path=$(dirname "$file")

            if [ "$path" = "." ]; then
              url="https://jahanzaibranjha31.github.io/multi-tools/"
              title="Home"
            else
              folder=$(basename "$path")
              url="https://jahanzaibranjha31.github.io/multi-tools/$folder/"
              title=$(echo "$folder" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
            fi

            schema=$(cat <<EOF
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"BreadcrumbList",
  "itemListElement":[
    {
      "@type":"ListItem",
      "position":1,
      "name":"Home",
      "item":"https://jahanzaibranjha31.github.io/multi-tools/"
    },
    {
      "@type":"ListItem",
      "position":2,
      "name":"$title",
      "item":"$url"
    }
  ]
}
</script>
EOF
)

            sed -i "s#</head>#$schema\n</head>#" "$file"

          done

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto generate breadcrumb schema"

          git push
