name: HTML Sitemap Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  generate-html-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate HTML Sitemap
        run: |
          mkdir -p scripts

          cat > scripts/generate-html-sitemap.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const ROOT = process.cwd();
          const BASE_URL = 'https://jahanzaibranjha31.github.io/multi-tool';

          const ignore = new Set([
            '.git',
            '.github',
            'node_modules',
            'assets',
            'scripts',
            'templates'
          ]);

          const pages = [];

          function scan(dir) {
            const items = fs.readdirSync(dir);

            for (const item of items) {

              if (ignore.has(item)) continue;

              const full = path.join(dir, item);

              if (fs.statSync(full).isDirectory()) {
                scan(full);
                continue;
              }

              if (item !== 'index.html') continue;

              let rel = path.relative(ROOT, full).replace(/\\/g,'/');

              rel = rel.replace('/index.html','');

              if(rel === 'index.html')
                rel = '';

              pages.push({
                url: BASE_URL + '/' + rel,
                title: rel === '' ? 'Home' : rel.split('/').pop()
              });

            }
          }

          scan(ROOT);

          pages.sort((a,b)=>a.title.localeCompare(b.title));

          let html = `<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HTML Sitemap | Multi Tool</title>

<meta name="description" content="Browse every page on Multi Tool from one organized sitemap.">

<link rel="canonical" href="${BASE_URL}/sitemap/">

<style>

body{
font-family:Arial,sans-serif;
max-width:1200px;
margin:auto;
padding:40px;
line-height:1.7;
background:#fafafa;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card a{
text-decoration:none;
font-weight:bold;
color:#0055ff;
word-break:break-word;
}

</style>

</head>

<body>

<h1>HTML Sitemap</h1>

<p>
Browse every page available on Multi Tool.
</p>

<div class="grid">
`;

          for(const page of pages){

            html += `
<div class="card">
<h2>${page.title}</h2>
<a href="${page.url}">
${page.url}
</a>
</div>
`;

          }

          html += `
</div>

</body>

</html>`;

          fs.mkdirSync('sitemap',{recursive:true});

          fs.writeFileSync('sitemap/index.html',html);

          console.log("HTML sitemap created.");
          EOF

      - name: Run Generator
        run: node scripts/generate-html-sitemap.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap/index.html

          git diff --cached --quiet || git commit -m "Auto update HTML sitemap"

          git push
