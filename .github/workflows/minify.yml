name: Minify HTML CSS JS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minifiers
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Minify HTML
        run: |
          find . -name "*.html" | while read file; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              -o "$file" "$file"
          done

      - name: Minify CSS
        run: |
          find . -name "*.css" | while read file; do
            cleancss -o "$file" "$file"
          done

      - name: Minify JavaScript
        run: |
          find . -name "*.js" | while read file; do
            terser "$file" -c -m -o "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || (
            git commit -m "Auto minify website files"
            git push
          )
